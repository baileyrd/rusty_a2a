name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `build.rs` compiles spec/a2a.proto with tonic-prost-build when the
      # `grpc` feature is on, and that needs a protoc binary.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build
        run: cargo build --features full --all-targets

      - name: Test
        run: cargo test --features full --all-targets

      - name: Doc tests
        run: cargo test --features full --doc

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --features full --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --features full --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Each optional feature gates real code, so a build with the others off
      # is the only thing that catches a missing `#[cfg]` or a dependency
      # declared under the wrong feature. `--all-targets` is load-bearing: it
      # compiles the examples and integration suites too, which is what catches
      # a `required-features` gate that names less than the target needs.
      - name: No features
        run: cargo check --all-targets

      - name: Client only
        run: cargo check --features client --all-targets

      - name: Server only
        run: cargo check --features server --all-targets

      - name: Signing only
        run: cargo check --features signing --all-targets

      - name: gRPC only
        run: cargo check --features grpc --all-targets

      - name: Client and server, no gRPC
        run: cargo check --features client,server --all-targets

      - name: gRPC and server, no client
        run: cargo check --features grpc,server --all-targets

      # The generated types live outside `server` so a gRPC client does not
      # have to enable it; this is what keeps that true.
      - name: gRPC and client, no server
        run: cargo check --features grpc,client --all-targets

      # A `required-features` gate that asks for MORE than its target needs
      # is invisible to compilation: cargo silently drops the target and the
      # suite reports success by not existing. Naming each suite under the
      # minimum it actually needs is what makes an over-strict gate an error.
      - name: Every test suite runs under its own features
        run: |
          cargo test --test wire_format -- --list
          cargo test --features client,server --test integration -- --list
          cargo test --features client,server --test rest_client -- --list
          cargo test --features grpc,client,server --test grpc_client -- --list
          cargo test --features client,server --test security_and_push_notifications -- --list
          cargo test --features client,server --test history_length_and_extensions -- --list
          cargo test --features grpc,server --test grpc_integration -- --list

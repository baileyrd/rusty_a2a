[package]
name = "rusty_a2a"
version = "0.1.0"
edition = "2021"
description = "A reusable Rust implementation of the Agent2Agent (A2A) protocol (https://a2a-protocol.org)"
license = "Apache-2.0"
repository = "https://github.com/baileyrd/rusty_a2a"
keywords = ["a2a", "agent", "protocol", "agent2agent"]
categories = ["network-programming", "asynchronous"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
base64 = "0.22"

# client feature
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", optional = true }
eventsource-stream = { version = "0.2", optional = true }

# server feature
axum = { version = "0.7", features = ["json"], optional = true }
async-trait = { version = "0.1", optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tokio-util = { version = "0.7", optional = true }
async-stream = { version = "0.3", optional = true }

tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"], optional = true }
tracing = "0.1"

# signing feature (Agent Card JWS signing/verification)
p256 = { version = "0.14", features = ["ecdsa"], optional = true }
ed25519-dalek = { version = "3", optional = true }
getrandom = { version = "0.4", optional = true }
signature = { version = "3", optional = true }

# grpc feature
tonic = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }

[features]
default = []
client = [
  "dep:reqwest",
  "dep:futures-core",
  "dep:futures-util",
  "dep:eventsource-stream",
  "dep:tokio",
  "tokio/rt",
]
server = [
  "dep:axum",
  "dep:tokio",
  "dep:async-trait",
  "dep:tokio-stream",
  "dep:tokio-util",
  "dep:async-stream",
  "dep:futures-util",
  "dep:futures-core",
  "dep:reqwest",
  "tokio/rt-multi-thread",
]
signing = ["dep:p256", "dep:ed25519-dalek", "dep:getrandom", "dep:signature"]
grpc = [
  "dep:tonic",
  "dep:prost",
  "dep:prost-types",
  "dep:tonic-prost",
  "dep:tonic-prost-build",
  "dep:tokio",
  "dep:futures-core",
  "dep:futures-util",
  "tokio/rt-multi-thread",
]
full = ["client", "server", "signing", "grpc"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"

[[example]]
name = "echo_server"
path = "examples/echo_server.rs"
required-features = ["server"]

[[example]]
name = "mock_server"
path = "examples/mock_server.rs"
required-features = ["server"]

[[example]]
name = "send_message"
path = "examples/send_message.rs"
required-features = ["client"]

[[test]]
name = "wire_format"
path = "tests/wire_format.rs"
# Deliberately no `required-features`: the data model is always compiled, and
# its JSON encoding is what every binding and every peer SDK shares.

[[test]]
name = "rest_client"
path = "tests/rest_client.rs"
required-features = ["client", "server"]

[[test]]
name = "grpc_client"
path = "tests/grpc_client.rs"
# The gRPC service lives under `server`, which `grpc` does not itself enable.
required-features = ["grpc", "client", "server"]

[[test]]
name = "integration"
path = "tests/integration.rs"
# JSON-RPC and REST only — deliberately not `full`. Gating this on `grpc`
# would make the suite silently skip anywhere `protoc` is missing.
required-features = ["client", "server"]

[[test]]
name = "grpc_integration"
path = "tests/grpc_integration.rs"
# The gRPC service lives under `server`, which `grpc` does not itself enable.
required-features = ["grpc", "server"]

[[test]]
name = "security_and_push_notifications"
path = "tests/security_and_push_notifications.rs"
required-features = ["client", "server"]

[[test]]
name = "history_length_and_extensions"
path = "tests/history_length_and_extensions.rs"
required-features = ["client", "server"]

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }
